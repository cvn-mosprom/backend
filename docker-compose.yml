# Mosprom backend stack.
#
#   cp .env.example .env
#   SIM_COMMIT=$(scripts/simcommit.sh) docker compose up -d --build
#
# Services: caddy (TLS + reverse proxy + web build), api, db, migrate (one-shot), redis, sim, bot.
# Optional profiles:
#   pgbouncer     transaction pooling in front of db. Also set in .env:  DB_HOST=pgbouncer DB_PORT=6432 PGBOUNCER=1
#   sim-replicas  a second sim container aliased to `sim` (Docker DNS round-robin; the API's SIM_URL stays http://sim:8080)
#   backup        pg_dump -Fc every BACKUP_INTERVAL_H hours into ./backups (keeps BACKUP_KEEP files); manual: scripts/backup.sh,
#                 scripts/restore.sh.   docker compose --profile backup up -d backup
#
# Everything published on the host is bound to 127.0.0.1 except caddy (80/443).

name: mosprom

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Deliberately in-network URLs: they override anything in .env (which holds host-style URLs for running pytest/uvicorn
# from the host). api/bot talk to Postgres through DB_HOST:DB_PORT (db:5432, or pgbouncer:6432 with the profile);
# migrate always talks to db directly (DDL must not go through transaction pooling).
x-db-url: &db-url postgresql+asyncpg://${POSTGRES_USER:-mosprom}:${POSTGRES_PASSWORD:-mosprom}@${DB_HOST:-db}:${DB_PORT:-5432}/${POSTGRES_DB:-mosprom}
x-db-url-direct: &db-url-direct postgresql+asyncpg://${POSTGRES_USER:-mosprom}:${POSTGRES_PASSWORD:-mosprom}@db:5432/${POSTGRES_DB:-mosprom}

# One secret shared by api and bot for /internal/* (X-Internal-Token). The dev default is refused by the api under APP_ENV=prod.
x-internal-token: &internal-token ${INTERNAL_TOKEN:-dev-internal-token}

x-env-file: &env-file
  - path: .env
    required: false

x-api-build: &api-build
  context: ./api
  dockerfile: Dockerfile

x-sim: &sim
  build:
    context: . # repo root: the image bundles vendor/frontend/web/src/lib (see .dockerignore)
    dockerfile: sim/Dockerfile
    args:
      SIM_COMMIT: ${SIM_COMMIT:-dev}
  # image is pinned to the vendored frontend commit (lib/sim): a lib/sim bump = new tag = new sim image
  image: mosprom-sim:${SIM_COMMIT:-dev}
  restart: unless-stopped
  mem_limit: 640m # ~100 MB per Node worker at idle; SIM_WORKERS (1..4) bounds the total
  env_file: *env-file
  environment:
    PORT: "8080"
    SIM_COMMIT: ${SIM_COMMIT:-dev}
    SIM_WORKERS: ${SIM_WORKERS:-2}
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:8080/health',{signal:AbortSignal.timeout(2500)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
    interval: 10s
    timeout: 4s
    retries: 5
    start_period: 10s
  logging: *logging

services:
  # caddy = TLS + reverse proxy + the Mini App web build (web/Dockerfile: SvelteKit adapter-static built from
  # vendor/frontend/web with VITE_API_URL=/, copied to /srv), so the app and the API share one origin.
  caddy:
    build:
      context: . # repo root: the image bundles vendor/frontend/web (web/Dockerfile.dockerignore)
      dockerfile: web/Dockerfile
    image: mosprom-caddy:${WEB_TAG:-dev}
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
    logging: *logging

  api:
    build: *api-build
    image: mosprom-api:${API_TAG:-dev}
    restart: unless-stopped
    env_file: *env-file
    environment:
      DATABASE_URL: *db-url
      PGBOUNCER: ${PGBOUNCER:-0} # 1 only with the pgbouncer profile (asyncpg: statement_cache_size=0)
      REDIS_URL: redis://redis:6379/0
      SIM_URL: http://sim:8080
      INTERNAL_TOKEN: *internal-token
      # CORS of the web client (empty: dev -> http://localhost:5173, prod -> origin of WEBAPP_URL, else https://DOMAIN)
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      WEBAPP_URL: ${WEBAPP_URL:-}
      DOMAIN: ${DOMAIN:-localhost}
      # uvicorn worker processes (WEB_CONCURRENCY). Keep <= 4: each worker holds a DB pool of DB_POOL_SIZE+DB_MAX_OVERFLOW
      # (5+5), so 4 workers = 40 of Postgres' 100 connections. The sim is the CPU hog, not the API.
      WEB_CONCURRENCY: ${API_WORKERS:-2}
    expose:
      - "8000"
    mem_limit: 768m
    stop_grace_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # sim is intentionally NOT a dependency: leads, quiz, events and auth must work while sim is down.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 15s
    logging: *logging

  migrate:
    build: *api-build
    image: mosprom-api:${API_TAG:-dev}
    restart: "no"
    env_file: *env-file
    environment:
      DATABASE_URL: *db-url-direct
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  db:
    image: postgres:16-alpine # one pinned major, no version-specific features (spec: Блок. Стек)
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mosprom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mosprom}
      POSTGRES_DB: ${POSTGRES_DB:-mosprom}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 384m # maxmemory 256mb below + overhead
    # Caches / counters only (rate limit, idempotency cache, leaderboard cache, initData cache); no game state,
    # so no persistence. volatile-lru: only keys that have a TTL may be evicted.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  sim:
    <<: *sim
    expose:
      - "8080"
    ports:
      - "127.0.0.1:58080:8080" # localhost-only, for contract tests / debugging (SIM_URL=http://127.0.0.1:58080)

  sim-replica:
    <<: *sim
    profiles: ["sim-replicas"]
    networks:
      default:
        aliases:
          - sim # same DNS name as the primary: Docker's embedded DNS returns both containers

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    profiles: ["pgbouncer"]
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-mosprom}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-mosprom}
      DB_NAME: ${POSTGRES_DB:-mosprom}
      POOL_MODE: transaction # => PGBOUNCER=1 in the api (statement_cache_size=0, prepared_statement_cache_size=0)
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "20"
      LISTEN_PORT: "6432"
      # asyncpg startup parameters (statement_timeout) are not accepted in transaction mode, so the api enforces its 3 s
      # with command_timeout (PGBOUNCER=1) and pgbouncer cancels anything longer than 4 s on its own.
      QUERY_TIMEOUT: "4"
    expose:
      - "6432"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    image: mosprom-bot:${BOT_TAG:-dev}
    restart: unless-stopped
    env_file: *env-file
    environment:
      DATABASE_URL: *db-url
      PGBOUNCER: ${PGBOUNCER:-0} # 1 only with the pgbouncer profile (asyncpg: statement_cache_size=0)
      REDIS_URL: redis://redis:6379/0
      API_INTERNAL_URL: http://api:8000 # in-network only: caddy does not proxy /internal/*
      INTERNAL_TOKEN: *internal-token
      HR_ADMIN_TG_IDS: ${HR_ADMIN_TG_IDS:-} # S6: Telegram ids allowed to use the HR commands / receive lead cards
      HR_CHAT_ID: ${HR_CHAT_ID:-} # S6: optional chat for lead cards (default: every admin)
      BOTS_ENABLED: ${BOTS_ENABLED:-1} # same flag as the api: demo bots in /top
    mem_limit: 384m
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started # the bot's jobs call the api; it retries, so no healthy-gate
    logging: *logging

  # pg_dump -Fc into ./backups every BACKUP_INTERVAL_H hours (first dump right at start), newest BACKUP_KEEP kept.
  # Off by default: docker compose --profile backup up -d backup.   Restore: scripts/restore.sh <file>.
  backup:
    image: postgres:16-alpine # same major as db => compatible pg_dump
    profiles: ["backup"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh", "--loop"]
    environment:
      PGHOST: db
      PGPORT: "5432" # direct, never through pgbouncer
      PGUSER: ${POSTGRES_USER:-mosprom}
      PGPASSWORD: ${POSTGRES_PASSWORD:-mosprom}
      PGDATABASE: ${POSTGRES_DB:-mosprom}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_H: ${BACKUP_INTERVAL_H:-6}
      BACKUP_KEEP: ${BACKUP_KEEP:-28}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
