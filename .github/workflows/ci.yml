name: ci
on:
  pull_request:
  push:
    branches: [main, 'infra/**']
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (startsWith(github.ref, 'refs/heads/infra/') && vars.PROTOTYPE_CD_ENABLED != 'true') }}
jobs:
  security:
    uses: ./.github/workflows/security.yml
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: docker.io/library/postgres:16-bookworm@sha256:d81f7b51697014367236d07ec58b54153fc28f828b72bf247fe5c7487520bcb0
        env: {POSTGRES_USER: mosprom, POSTGRES_PASSWORD: mosprom, POSTGRES_DB: mosprom_test}
        ports: ['5432']
        options: >-
          --health-cmd "pg_isready -U mosprom"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: docker.io/library/redis:7-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
        ports: ['6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          token: ${{ secrets.FRONTEND_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '22'}
      - name: Dynamic service endpoints
        run: |
          echo "TEST_DATABASE_URL=postgresql+asyncpg://mosprom:mosprom@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/mosprom_test" >> "$GITHUB_ENV"
          echo "TEST_REDIS_URL=redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}/0" >> "$GITHUB_ENV"
      - name: Isolated environments for API, bot, contract and tooling
        run: |
          for part in api bot contract; do
            python -m venv "$part/.venv"
            "$part/.venv/bin/pip" install --require-hashes -r "$part/requirements.lock"
            "$part/.venv/bin/pip" install --require-hashes -r requirements-ci.lock
          done
      - run: bot/.venv/bin/pip install --require-hashes -r bot/requirements-dev.lock
      - run: api/.venv/bin/ruff check --select E9,F63,F7,F82 api/app bot/app
      - run: api/.venv/bin/bandit -r api/app bot/app -ll
      - name: Web bootstrap CSP allowlist
        run: node --test web/generate-csp.test.mjs
      - name: Typecheck test and bundle simulator
        run: |
          cd sim
          npm ci
          npm audit --audit-level=high
          npm run check
          node dist/server.mjs > "$RUNNER_TEMP/sim.log" 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health && break; sleep 1; done
      - name: API tests without unexpected skips
        run: |
          cd api
          SIM_URL=http://127.0.0.1:8080 .venv/bin/pytest -q --junitxml=results.xml --cov=app --cov-report=xml
          .venv/bin/python ../tools/check_pytest.py results.xml
      - name: Bot tests without Telegram network access
        run: |
          cd bot
          .venv/bin/pytest -q --junitxml=results.xml
          .venv/bin/python ../tools/check_pytest.py results.xml
      - name: Contract drift and tests
        env: {SIM_URL: http://127.0.0.1:8080}
        run: |
          sh contract/check.sh
          cd contract
          npm audit --audit-level=high
          .venv/bin/pytest -q --junitxml=results.xml
          .venv/bin/python ../tools/check_pytest.py results.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: backend-tests
          path: |
            **/results.xml
            api/coverage.xml
          retention-days: 14
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          token: ${{ secrets.FRONTEND_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '22'}
      - name: Full-stack E2E including real frontend client and restart scenarios
        run: bash tools/e2e.sh
  publish:
    needs: [quality, integration, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read, packages: write, id-token: write}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: api, context: ./api, dockerfile: api/Dockerfile}
          - {name: bot, context: ./bot, dockerfile: bot/Dockerfile}
          - {name: sim, context: ., dockerfile: sim/Dockerfile}
          - {name: web, context: ., dockerfile: web/Dockerfile}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          token: ${{ secrets.FRONTEND_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Source coordinates
        id: source
        run: echo "frontend=$(git rev-parse HEAD:vendor/frontend)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          outputs: type=oci,dest=/tmp/image.tar
          tags: ghcr.io/cvn-mosprom/${{ matrix.name }}:sha-${{ github.sha }}
          provenance: mode=max,version=v1
          sbom: true
          build-args: |
            SIM_COMMIT=${{ steps.source.outputs.frontend }}
            FRONTEND_REVISION=${{ steps.source.outputs.frontend }}
            ROUTING_ZONE=${{ vars.ROUTING_ZONE }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Open the OCI layout for Trivy
        run: |
          mkdir "$RUNNER_TEMP/image-oci"
          tar -xf /tmp/image.tar -C "$RUNNER_TEMP/image-oci"
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with: {input: '${{ runner.temp }}/image-oci', severity: 'HIGH,CRITICAL', exit-code: '1', scanners: vuln, ignore-unfixed: false}
      - name: Push the already scanned OCI artifact
        run: |
          # skopeo is installed from the runner's signed package repository.
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
          skopeo copy --all --preserve-digests oci-archive:/tmp/image.tar "docker://ghcr.io/cvn-mosprom/${IMAGE}:sha-${GITHUB_SHA}"
        env: {IMAGE: '${{ matrix.name }}'}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with: {cosign-release: v3.0.5}
      - name: Sign image and provenance, write immutable coordinates
        env:
          IMAGE: ${{ matrix.name }}
          FRONTEND_SHA: ${{ steps.source.outputs.frontend }}
        run: python tools/publish_metadata.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: 'image-${{ matrix.name }}', path: image.json, retention-days: 14}
  release-pr:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {pattern: 'image-*', path: artifacts}
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: cvn-mosprom
          repositories: deploy
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cvn-mosprom/deploy
          path: deploy
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false
      - name: Create complete release PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ROUTING_ZONE: ${{ vars.ROUTING_ZONE }}
        run: bash deploy/scripts/release_pr.sh artifacts
  publish-prototype:
    needs: [quality, integration, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/infra/devops-regional-routing'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read, packages: write, id-token: write}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: api, context: ./api, dockerfile: api/Dockerfile}
          - {name: bot, context: ./bot, dockerfile: bot/Dockerfile}
          - {name: sim, context: ., dockerfile: sim/Dockerfile}
          - {name: web, context: ., dockerfile: web/Dockerfile}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          token: ${{ secrets.FRONTEND_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Reviewed prototype source pair
        id: source
        run: echo "frontend=$(git rev-parse HEAD:vendor/frontend)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          outputs: type=oci,dest=/tmp/image.tar
          tags: ghcr.io/cvn-mosprom/${{ matrix.name }}:prototype-${{ github.sha }}
          provenance: mode=max,version=v1
          sbom: true
          build-args: |
            SIM_COMMIT=${{ steps.source.outputs.frontend }}
            FRONTEND_REVISION=${{ steps.source.outputs.frontend }}
            ROUTING_ZONE=ochakovo.velikoss.ru
            REGIONAL_ROUTING=0
            VITE_API_URL=/
            VITE_BOT_USERNAME=cvnprombot
            VITE_TELEGRAM_ONLY=1
            VITE_HR_DEMO=1
            EXTERNAL_MEDIA=0
          cache-from: type=gha,scope=prototype-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=prototype-${{ matrix.name }}
      - name: Open the OCI layout for Trivy
        run: |
          mkdir "$RUNNER_TEMP/image-oci"
          tar -xf /tmp/image.tar -C "$RUNNER_TEMP/image-oci"
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with: {input: '${{ runner.temp }}/image-oci', severity: 'HIGH,CRITICAL', exit-code: '1', scanners: vuln, ignore-unfixed: false}
      - name: Publish the scanned artifact without rebuilding
        env: {IMAGE: '${{ matrix.name }}'}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
          skopeo copy --all --preserve-digests oci-archive:/tmp/image.tar "docker://ghcr.io/cvn-mosprom/${IMAGE}:prototype-${GITHUB_SHA}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with: {cosign-release: v3.0.5}
      - name: Sign prototype images and source provenance
        env:
          IMAGE: ${{ matrix.name }}
          FRONTEND_SHA: ${{ steps.source.outputs.frontend }}
          IMAGE_TAG_PREFIX: prototype
          RELEASE_PROFILE: prototype-v1
        run: python tools/publish_metadata.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: 'prototype-image-${{ matrix.name }}', path: image.json, retention-days: 30}
  deliver-prototype:
    needs: publish-prototype
    if: github.event_name == 'push' && github.ref == 'refs/heads/infra/devops-regional-routing' && vars.PROTOTYPE_CD_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: prototype
    timeout-minutes: 20
    permissions: {contents: read, packages: read, deployments: write}
    concurrency:
      group: prototype-rollout
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: cvn-mosprom
          repositories: deploy
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cvn-mosprom/deploy
          ref: infra/devops-regional-routing
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {pattern: 'prototype-image-*', path: artifacts}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with: {cosign-release: v3.0.5}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Assemble and verify one immutable release
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          frontend=$(python3 -c 'import json;print(json.load(open("artifacts/prototype-image-api/image.json"))["frontendSha"])')
          python3 scripts/prototype_release.py prototype-release.json --artifacts artifacts --backend-sha "$GITHUB_SHA" --frontend-sha "$frontend" --verify
      - name: Deliver only to the isolated prototype
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROTOTYPE_SSH_KEY: ${{ secrets.PROTOTYPE_SSH_KEY }}
          PROTOTYPE_SSH_KNOWN_HOSTS: ${{ vars.PROTOTYPE_SSH_KNOWN_HOSTS }}
          PROTOTYPE_SSH_HOST: ${{ vars.PROTOTYPE_SSH_HOST }}
          PROTOTYPE_SSH_USER: mosprom-cd
        run: python3 scripts/prototype_send.py prototype-release.json
      - name: Public HTTPS readiness
        run: |
          curl --fail --silent --show-error --max-time 20 https://ochakovo.velikoss.ru/ready
          curl --fail --silent --show-error --max-time 20 https://ochakovo.velikoss.ru/app --output /dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with: {name: prototype-release, path: prototype-release.json, retention-days: 90}
